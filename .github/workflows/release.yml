name: Draft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore DriveHarbor.slnx --locked-mode

      - name: Build
        run: dotnet build DriveHarbor.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DriveHarbor.slnx --configuration Release --no-build --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/DriveHarbor.App/DriveHarbor.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/DriveHarbor-win-x64
          dotnet publish src/DriveHarbor.Updater/DriveHarbor.Updater.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/DriveHarbor-win-x64 -p:DebugType=None -p:DebugSymbols=false

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/DriveHarbor-win-x64/* -DestinationPath artifacts/DriveHarbor-${{ github.ref_name }}-win-x64.zip

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $archive = "artifacts/DriveHarbor-${{ github.ref_name }}-win-x64.zip"
          $checksum = "${archive}.sha256"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath $checksum -Encoding ascii

      - name: Attest release archive
        id: attest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/DriveHarbor-${{ github.ref_name }}-win-x64.zip

      - name: Copy attestation bundle
        shell: pwsh
        run: Copy-Item -LiteralPath '${{ steps.attest.outputs.bundle-path }}' -Destination 'artifacts/DriveHarbor-${{ github.ref_name }}-win-x64.zip.sigstore.json'

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/DriveHarbor-$env:GITHUB_REF_NAME-win-x64.zip artifacts/DriveHarbor-$env:GITHUB_REF_NAME-win-x64.zip.sha256 artifacts/DriveHarbor-$env:GITHUB_REF_NAME-win-x64.zip.sigstore.json --draft --prerelease --generate-notes --title "DriveHarbor $env:GITHUB_REF_NAME"
